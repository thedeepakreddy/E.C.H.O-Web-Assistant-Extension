name: Release checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: npm audit --audit-level=high
    - run: npm run build
    - run: npm run release:check
    - name: Install Chromium for the browser smoke test
      run: npx playwright install --with-deps chromium
    - run: npm run e2e:smoke
    - run: node tools/release/package.cjs
    - name: Upload installable extension
      uses: actions/upload-artifact@v4
      with:
        name: echo-online-${{ github.sha }}
        path: |
          package for sharing/Echo_Online_v*.zip
          package for sharing/Echo_Online_v*.sha256
